<!doctype html>
<!--
  第 3 步打样页：只为钉死画面风险（棋子清晰度、中文字体），第 4 步会整页重写。
  ?game=chess | ?game=xiangqi，视口按 540×720 设计。颜色、字号都是中性占位值。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打样</title>
<link rel="stylesheet" href="vendor/cm-chessboard/assets/chessboard.css">
<link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/markers/markers.css">
<style>
  html, body { margin: 0; background: #fff; color: #222;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif; }
  #stage { width: 540px; height: 720px; overflow: hidden; }
  #board { width: 540px; height: 540px; margin: 0 auto; }
  #board.xq { width: 490px; height: 544px; }
  #board svg.xq { display: block; width: 100%; height: 100%; }
  .caption { padding: 12px 16px 0; }
  .l1 { font-size: 24px; }
  .l1 .weak { color: #888; }
  .l2 { font-size: 18px; color: #666; margin-top: 6px; display: flex; justify-content: space-between; }
  .l3 { font-size: 16px; color: #666; margin-top: 6px; }
</style>
</head>
<body>
<div id="stage">
  <div id="board"></div>
  <div class="caption">
    <div class="l1" id="l1"></div>
    <div class="l2"><span id="l2a"></span><span id="l2b"></span></div>
    <div class="l3" id="l3"></div>
  </div>
</div>
<script type="module">
import {Chessboard, FEN} from "./vendor/cm-chessboard/src/Chessboard.js"
import {Markers, MARKER_TYPE} from "./vendor/cm-chessboard/src/extensions/markers/Markers.js"
import {Chess} from "./vendor/chess.js/chess.js"

const game = new URLSearchParams(location.search).get("game") || "chess"
const $ = id => document.getElementById(id)

async function waitFor(test, ms = 5000) {
  const t0 = performance.now()
  while (!test()) {
    if (performance.now() - t0 > ms) throw new Error("timeout")
    await new Promise(r => setTimeout(r, 20))
  }
}

async function chess() {
  // 西班牙开局封闭变例，9. h3 之后（白方刚走 h3）
  const fen = "r1bq1rk1/2p1bppp/p1np1n2/1p2p3/4P3/1BP2N1P/PP1P1PP1/RNBQR1K1 b - - 0 9"
  const rules = new Chess(fen)  // 只为证明 chess.js 能加载
  const board = new Chessboard($("board"), {
    position: fen,
    assetsUrl: "./vendor/cm-chessboard/assets/",
    style: {animationDuration: 0},
    extensions: [{class: Markers}],
  })
  board.addMarker(MARKER_TYPE.square, "h2")
  board.addMarker(MARKER_TYPE.square, "h3")
  $("l1").innerHTML = 'opus<span class="weak">+xhigh</span>　执白'
  $("l2a").textContent = "9. h3 防止 …Bg4 牵制"
  $("l2b").textContent = "思考 52k +3.4k"
  $("l3").textContent = `轮到${rules.turn() === "b" ? "黑方" : "白方"}　将军：${rules.inCheck() ? "是" : "否"}　ABCxyz 0123456789`
  await waitFor(() => document.querySelector("#cm-chessboard-sprite svg")
    && document.querySelector("#cm-chessboard-markers svg")
    && document.querySelectorAll("#board .pieces use").length > 0)
}

// 中国象棋：自画棋盘 + CC0 棋子。FEN 行从黑方底线起，大写红方。
const XQ_NAMES = {k: "king", a: "advisor", b: "elephant", n: "horse", r: "chariot", c: "cannon", p: "pawn"}

async function loadPiece(code) {
  const color = code === code.toUpperCase() ? "red" : "black"
  const text = await (await fetch(`vendor/xiangqi-pieces/${color}_${XQ_NAMES[code.toLowerCase()]}.svg`)).text()
  const doc = new DOMParser().parseFromString(text, "image/svg+xml")
  const root = doc.documentElement
  // 素材没有 viewBox，不补的话缩放时不跟着缩
  root.setAttribute("viewBox", `0 0 ${parseFloat(root.getAttribute("width"))} ${parseFloat(root.getAttribute("height"))}`)
  const blob = new Blob([new XMLSerializer().serializeToString(doc)], {type: "image/svg+xml"})
  return URL.createObjectURL(blob)
}

async function xiangqi() {
  const fen = "3akab2/9/4b1n2/p1r1p3p/6c2/2P3P2/P3P1R1P/1C2B1N2/4A4/2BAK4"
  const S = 54.4, W = 9 * S, H = 10 * S, NS = "http://www.w3.org/2000/svg"
  const X = c => S / 2 + c * S, Y = r => S / 2 + r * S
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag)
    for (const k in attrs) e.setAttribute(k, attrs[k])
    parent.appendChild(e)
    return e
  }
  $("board").className = "xq"
  const svg = el("svg", {class: "xq", viewBox: `0 0 ${W} ${H}`}, $("board"))
  el("rect", {x: 0, y: 0, width: W, height: H, fill: "#e8c98f"}, svg)
  const g = el("g", {stroke: "#4a3520", "stroke-width": 1.2, fill: "none"}, svg)
  for (let r = 0; r < 10; r++) el("line", {x1: X(0), y1: Y(r), x2: X(8), y2: Y(r)}, g)
  for (let c = 0; c < 9; c++) {
    if (c === 0 || c === 8) { el("line", {x1: X(c), y1: Y(0), x2: X(c), y2: Y(9)}, g); continue }
    el("line", {x1: X(c), y1: Y(0), x2: X(c), y2: Y(4)}, g)
    el("line", {x1: X(c), y1: Y(5), x2: X(c), y2: Y(9)}, g)
  }
  for (const [r0, r1] of [[0, 2], [7, 9]]) {
    el("line", {x1: X(3), y1: Y(r0), x2: X(5), y2: Y(r1)}, g)
    el("line", {x1: X(5), y1: Y(r0), x2: X(3), y2: Y(r1)}, g)
  }
  el("rect", {x: X(0) - 4, y: Y(0) - 4, width: 8 * S + 8, height: 9 * S + 8, "stroke-width": 2.4}, g)
  const river = el("text", {x: W / 2, y: Y(4.5), "text-anchor": "middle", "dominant-baseline": "central",
    "font-size": 26, fill: "#4a3520", "letter-spacing": 18}, svg)
  river.textContent = "楚 河　　汉 界"

  const codes = new Set(fen.replace(/[^a-zA-Z]/g, ""))
  const urls = Object.fromEntries(await Promise.all([...codes].map(async c => [c, await loadPiece(c)])))
  const loads = []
  const P = S * 0.92
  fen.split("/").forEach((row, r) => {
    let c = 0
    for (const ch of row) {
      if (/\d/.test(ch)) { c += +ch; continue }
      const img = el("image", {href: urls[ch], x: X(c) - P / 2, y: Y(r) - P / 2, width: P, height: P}, svg)
      loads.push(new Promise((ok, bad) => { img.onload = ok; img.onerror = bad }))
      c++
    }
  })
  // 上一步：车三进三（g4→g… 示意），起点终点加框
  for (const [c, r] of [[6, 9], [6, 6]]) {
    el("rect", {x: X(c) - P / 2 - 2, y: Y(r) - P / 2 - 2, width: P + 4, height: P + 4, fill: "none",
      stroke: "#2a6fdb", "stroke-width": 2, "stroke-dasharray": r === 9 ? "5 4" : ""}, svg)
  }
  await Promise.all(loads)
  $("l1").innerHTML = 'astra<span class="weak">+max</span>　执红'
  $("l2a").textContent = "22. 车三进三　马７进６"
  $("l2b").textContent = "思考 38k +1.2k"
  $("l3").textContent = "炮二平五 将军　前兵进一　一卒平５　俥傌砲　ABCxyz 0123456789"
}

window.ready = (async () => {
  await (game === "xiangqi" ? xiangqi() : chess())
  await document.fonts.ready
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)))
  return true
})()
window.ready.catch(e => { document.body.dataset.error = String(e); console.error(e) })
</script>
</body>
</html>
