<!doctype html>
<!--
  棋谱阅读器（docs/viewer.md）。经本机静态服务打开：仓库根目录 node viewer/serve.mjs，
  再开 http://127.0.0.1:8765/viewer/?files=/runs/a/game.pgn,/runs/b/game.pgn
  也可以把棋谱文件拖进页面，或从同级页面 series.html（对阵总览）/ catalog.html（全部 192 盘目录）跳入。
  版式按窗口宽度自动选（layout=compact / wide 强制，rec=1 恒为窄版）：
  桌面宽版（≥900px）右边多一栏 #side，手机窄视口（<900px）纵向叠排棋盘、翻步栏、引擎评分/评注与着法表；窄版录屏态隐藏 #side。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>棋谱阅读器</title>
<meta name="description" content="Interactive Chess &amp; Xiangqi game viewer for frontier LLMs — step through model reasoning, thinking tokens, and engine blunder annotations.">
<meta property="og:type" content="website">
<meta property="og:title" content="AGI Chess · Frontier LLM Chess &amp; Xiangqi Game Viewer">
<meta property="og:description" content="Step through full Chess and Xiangqi games played by frontier LLMs with move-by-move reasoning, thinking tokens, and engine blunder annotations.">
<meta property="og:url" content="https://xiaohuaxi.github.io/agi-chess/?lang=en">
<meta property="og:image" content="https://xiaohuaxi.github.io/agi-chess/og-card.png">
<meta property="og:image:alt" content="Gemini 4 Neon vs Gemini 4 Carbon chess game at 20...Re8?? Blunder in the AGI Chess Viewer">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AGI Chess · Frontier LLM Chess &amp; Xiangqi Game Viewer">
<meta name="twitter:description" content="Step through full Chess and Xiangqi games played by frontier LLMs with move-by-move reasoning, thinking tokens, and engine blunder annotations.">
<meta name="twitter:image" content="https://xiaohuaxi.github.io/agi-chess/og-card.png">
<link rel="stylesheet" href="vendor/cm-chessboard/assets/chessboard.css">
<link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/markers/markers.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- lichess 的将军标记：格子中心红、向外渐隐（chessground.brown.css 的 square.check） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <radialGradient id="cb-check">
    <stop offset="0" stop-color="rgb(255,0,0)" stop-opacity="1"/>
    <stop offset="0.25" stop-color="rgb(231,0,0)" stop-opacity="1"/>
    <stop offset="0.89" stop-color="rgb(169,0,0)" stop-opacity="0"/>
    <stop offset="1" stop-color="rgb(158,0,0)" stop-opacity="0"/>
  </radialGradient>
</svg>
<div id="stage" class="compact">
  <div id="strip"></div>
  <div class="bar" id="bar-top"></div>
  <div id="board-area">
    <div id="board-chess" class="board" hidden></div>
    <div id="board-xq" class="board" hidden></div>
    <div id="banner" hidden></div>
    <div id="title" hidden></div>
  </div>
  <div class="bar" id="bar-bottom"></div>
  <aside id="side">
    <div id="s-head"></div>
    <div id="s-players"></div>
    <div id="s-ctrl">
      <button type="button" data-act="first" title="本盘开头（Home）">⏮</button>
      <button type="button" data-act="prev" title="上一步（←）">◀</button>
      <button type="button" data-act="play" id="s-play" title="播放 / 暂停（空格）">播放</button>
      <button type="button" data-act="next" title="下一步（→）">▶</button>
      <button type="button" data-act="last" title="本盘结尾（End）">⏭</button>
    </div>
    <div id="s-moves"></div>
    <div id="s-note"></div>
    <div id="s-keys"><span><b>←</b> <b>→</b> 单步</span><span><b>空格</b> 播放 / 暂停</span><span><b>Home</b> <b>End</b> 本盘首尾</span><span><b>PgUp</b> <b>PgDn</b> 换盘</span><span>点着法跳到那步</span></div>
  </aside>
  <div id="summary" hidden></div>
  <div id="hint"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
